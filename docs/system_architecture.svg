<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Title -->
  <rect x="0" y="0" width="900" height="60" fill="url(#grad-header)" />
  <text x="450" y="38" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="1">PATENTPILOT — SYSTEM ARCHITECTURE</text>

  <!-- Layer 1: Frontend -->
  <g transform="translate(40, 85)" filter="url(#shadow)">
    <rect x="0" y="0" width="820" height="75" rx="10" fill="url(#grad-card)" stroke="#6366f1" stroke-width="2" />
    <text x="20" y="28" fill="#818cf8" font-size="13" font-weight="700" letter-spacing="1">PRESENTATION LAYER (FRONTEND)</text>
    <text x="20" y="52" fill="#f8fafc" font-size="16" font-weight="700">React 18 SPA + TypeScript + Vite</text>
    <text x="350" y="52" fill="#94a3b8" font-size="13">Routes: / (Submit), /workspace/:id, /workspace/:id/patent/:pid, /report/:id, /history, /about</text>
  </g>

  <!-- Arrow Down -->
  <path d="M 450 160 L 450 185" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow)" />

  <!-- Layer 2: API Gateway -->
  <g transform="translate(40, 185)" filter="url(#shadow)">
    <rect x="0" y="0" width="820" height="65" rx="10" fill="url(#grad-card)" stroke="#06b6d4" stroke-width="2" />
    <text x="20" y="26" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1">API GATEWAY &amp; ROUTING</text>
    <text x="20" y="48" fill="#f8fafc" font-size="16" font-weight="700">FastAPI Backend Core (Python 3.11)</text>
    <text x="350" y="48" fill="#94a3b8" font-size="13">Endpoints: /api/v1/molecule, /api/v1/patents, /api/v1/report, /api/v1/history</text>
  </g>

  <!-- Arrow Down split -->
  <path d="M 180 250 L 180 280" stroke="#818cf8" stroke-width="2.5" />
  <path d="M 450 250 L 450 280" stroke="#38bdf8" stroke-width="2.5" />
  <path d="M 720 250 L 720 280" stroke="#34d399" stroke-width="2.5" />

  <!-- Layer 3: Services Subsystems -->
  <!-- Box 1: Molecule Engine -->
  <g transform="translate(40, 280)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="130" rx="8" fill="url(#grad-card)" stroke="#818cf8" stroke-width="1.5" />
    <text x="15" y="25" fill="#818cf8" font-size="12" font-weight="700">MOLECULE ENGINE</text>
    <text x="15" y="48" fill="#f8fafc" font-size="14" font-weight="600">• SMILES Validation</text>
    <text x="15" y="68" fill="#f8fafc" font-size="14" font-weight="600">• PubChem Name-to-SMILES</text>
    <text x="15" y="88" fill="#f8fafc" font-size="14" font-weight="600">• RDKit 2D SVG Render</text>
    <text x="15" y="108" fill="#f8fafc" font-size="14" font-weight="600">• Fingerprint Generation</text>
  </g>

  <!-- Box 2: Retrieval Subsystem -->
  <g transform="translate(310, 280)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="130" rx="8" fill="url(#grad-card)" stroke="#06b6d4" stroke-width="1.5" />
    <text x="15" y="25" fill="#38bdf8" font-size="12" font-weight="700">DUAL RETRIEVAL ENGINE</text>
    <text x="15" y="48" fill="#f8fafc" font-size="14" font-weight="600">• PubChem 2D Structure API</text>
    <text x="15" y="68" fill="#f8fafc" font-size="14" font-weight="600">• Europe PMC Literature API</text>
    <text x="15" y="88" fill="#f8fafc" font-size="14" font-weight="600">• Parallel asyncio.gather()</text>
    <text x="15" y="108" fill="#f8fafc" font-size="14" font-weight="600">• Deduplication &amp; Verify</text>
  </g>

  <!-- Box 3: Autonomous AI Agents -->
  <g transform="translate(610, 280)" filter="url(#shadow)">
    <rect x="0" y="0" width="250" height="130" rx="8" fill="url(#grad-card)" stroke="#34d399" stroke-width="1.5" />
    <text x="15" y="25" fill="#34d399" font-size="12" font-weight="700">MULTI-AGENT AI ENGINE</text>
    <text x="15" y="48" fill="#f8fafc" font-size="14" font-weight="600">• Explanation Agent</text>
    <text x="15" y="68" fill="#f8fafc" font-size="14" font-weight="600">• Scorer &amp; Risk Agent</text>
    <text x="15" y="88" fill="#f8fafc" font-size="14" font-weight="600">• Report Agent</text>
    <text x="15" y="108" fill="#f8fafc" font-size="14" font-weight="600">• Groq Llama 3.1 LLM</text>
  </g>

  <!-- Layer 4: Storage -->
  <path d="M 450 410 L 450 435" stroke="#94a3b8" stroke-width="2" />
  <g transform="translate(250, 435)" filter="url(#shadow)">
    <rect x="0" y="0" width="400" height="55" rx="8" fill="url(#grad-card)" stroke="#fbbf24" stroke-width="1.5" />
    <text x="20" y="24" fill="#fbbf24" font-size="12" font-weight="700">DATA PERSISTENCE LAYER</text>
    <text x="20" y="44" fill="#f8fafc" font-size="14" font-weight="600">SQLite / PostgreSQL DB — Analyses, Patents, Reports, Review Status</text>
  </g>
</svg>
